<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<title th:text="#{aleatorio.titulo}">Cuadro Aleatorio</title>
	<link rel="stylesheet" th:href="@{/css/cuadroAleatorio.css}" />
	<link rel="icon" type="image/png" th:href="@{https://res.cloudinary.com/dzjb4fkau/image/upload/v1770106134/logo_xjk4gb.png}">
</head>

<body>
	<header>
		<h1 th:text="#{aleatorio.titulo}">Cuadro Aleatorio</h1>
	</header>

	<!--Muestra el cuadro elegido de forma aleatoria -->
	<div th:if="${cuadro}" class="cuadro">
		<h2 th:text="${cuadro.nombre}">Título del cuadro</h2>
		<p>
			<strong class="indice" th:text="#{aleatorio.artista}">Artista:</strong> 
			<span th:text="${cuadro.autor}"></span>
		</p>
		<p>
			<strong class="indice" th:text="#{aleatorio.epoca}">Época:</strong> 
			<span th:text="${cuadro.epocaPintura}"></span>
		</p>
		<img th:src="@{${cuadro.urlImg}}" alt="Cuadro">
	</div>

	<!--Enlace para volver a la Galeria-->
	<div class="enlaces">
			<a th:href="@{/CuadroAleatorio}" class="enlace" th:text="#{aleatorio.otro}">Ver otro cuadro aleatorio</a>
			<a th:href="@{/galeria}" class="enlace" th:text="#{link.volver_galeria}">Volver a galería de arte</a>
		</div>

</body>

</html>
